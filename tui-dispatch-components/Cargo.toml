[package]
name = "tui-dispatch-components"
description = "Pre-built UI components for tui-dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["tui", "components", "ratatui", "terminal"]
categories = ["command-line-interface"]

[features]
default = []
tasks = ["tui-dispatch-core/tasks"]
subscriptions = ["tui-dispatch-core/subscriptions"]

[dependencies]
tui-dispatch-core.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui.workspace = true
crossterm.workspace = true
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratatui = { version = "0.30", default-features = false }
tinycrossterm = "0.1.0"
tokio = { version = "1", default-features = false, features = ["sync", "macros", "io-util", "rt", "time"] }

[dev-dependencies]
