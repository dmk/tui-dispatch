[package]
name = "tui-dispatch-debug"
description = "Debugging utilities for tui-dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
tasks = ["tui-dispatch-core/tasks"]
subscriptions = ["tui-dispatch-core/subscriptions"]
json-schema = ["schemars"]

[dependencies]
tui-dispatch-core = { workspace = true, features = ["debug"] }
tui-dispatch-action-name.workspace = true
tui-dispatch-components.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
base64 = "0.22"
clap.workspace = true
schemars = { version = "0.8", optional = true }
