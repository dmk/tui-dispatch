[package]
name = "minesweeper-example"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "minesweeper"
path = "src/main.rs"

[dependencies]
tui-dispatch-components = { path = "../../tui-dispatch-components" }
rand = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tui-dispatch = { path = "../../tui-dispatch" }
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tui-dispatch = { path = "../../tui-dispatch", default-features = false }
ratatui = { version = "0.29", default-features = false }
tinycrossterm = { path = "../../../tinycrossterm" }
