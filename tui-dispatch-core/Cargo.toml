[package]
name = "tui-dispatch-core"
description = "Core traits and types for tui-dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Enable debug adapter integration in runtimes
# (debug UI lives in tui-dispatch-debug)
debug = []
# Enable time control utilities for testing debounced actions
# Requires tokio with test-util feature
testing-time = ["tokio/test-util"]
# Enable TaskManager for async task lifecycle management
tasks = []
# Enable Subscriptions for declarative action sources
subscriptions = ["tokio-stream"]
# Enable tracing instrumentation (LoggingMiddleware, event bus logging)
tracing = ["dep:tracing"]
# Enable serde Serialize/Deserialize for Keybindings and DataResource
serde = ["dep:serde"]
# Enable schemars JsonSchema derive for DataResource
json-schema = ["schemars"]

[dependencies]
tokio-util.workspace = true
tokio-stream = { version = "0.1", optional = true }
tracing = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
schemars = { version = "0.8", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui.workspace = true
crossterm.workspace = true
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratatui = { version = "0.29", default-features = false }
tinycrossterm = "0.1.0"
tokio = { version = "1", default-features = false, features = ["sync", "macros", "io-util", "rt", "time"] }

[dev-dependencies]
serde_json = "1.0"
