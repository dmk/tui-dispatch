[package]
name = "github-lookup-example"
version = "0.1.0"
edition = "2021"
publish = false
description = "GitHub user lookup example demonstrating async/effects pattern"

[lib]
name = "github_lookup"
path = "src/lib.rs"

[[bin]]
name = "github-lookup"
path = "src/main.rs"

[dependencies]
tui-dispatch = { workspace = true, features = ["tasks"] }
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui.workspace = true
crossterm.workspace = true

[dev-dependencies]
# For testing
